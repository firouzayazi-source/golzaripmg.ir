name: عکس از سایتِ زنده

# فقط دستی؛ هیچ‌وقت زمان‌بندی یا حلقه.
# tools/snap.mjs حداکثر ۲ درخواستِ هم‌زمان با فاصله می‌زند و بعد از ۳ قطع می‌ایستد.
on:
  workflow_dispatch:
    inputs:
      path:
        description: مسیرِ صفحه
        default: /
      device:
        description: دستگاه
        type: choice
        options: [mobile, desktop]
        default: mobile

# هیچ‌وقت دو اجرای هم‌زمان.
concurrency:
  group: snap
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: مرورگر
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: عکس
        env:
          GOLZARI_RELAY_URL: ${{ secrets.GOLZARI_RELAY_URL }}
          GOLZARI_RELAY_KEY: ${{ secrets.GOLZARI_RELAY_KEY }}
          SNAP_PATH: ${{ inputs.path }}
          SNAP_DEVICE: ${{ inputs.device }}
        run: |
          flag=""
          [ "$SNAP_DEVICE" = "desktop" ] && flag="--desktop"
          node tools/snap.mjs "$SNAP_PATH" $flag --out shots/snap.png
      # عکس روی شاخه‌ی جدای shots؛ به main و انتشار کاری ندارد.
      - name: فرستادن به شاخه‌ی shots
        env:
          SNAP_PATH: ${{ inputs.path }}
          SNAP_DEVICE: ${{ inputs.device }}
        run: |
          name="$(echo "$SNAP_PATH" | sed 's/[^A-Za-z0-9-]\+/_/g; s/^_*$/home/')-${SNAP_DEVICE}.png"
          dir="$RUNNER_TEMP/shots"
          git clone --quiet --depth 1 --branch shots "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$dir" 2>/dev/null \
            || { mkdir -p "$dir" && git -C "$dir" init -q -b shots && git -C "$dir" remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; }
          cp shots/snap.png "$dir/$name"
          cd "$dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "عکس ${name}" || true
          git push -q origin shots
          echo "✓ $name"
